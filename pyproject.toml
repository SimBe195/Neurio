[project]
name = "neurio"
version = "0.1.0"
description = "Training a super-mario-bros AI using reinforcement learning"
authors = [{ name = "Simon Berger" }]
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "gym-super-mario-bros>=9.1.0",
    "gymnasium>=1.3.0",
    "hydra-core>=1.3.7",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "nes-py",
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "torch>=2.14.1",
    "torchinfo>=1.8.0",
    "tqdm>=4.70.1",
]

[project.urls]
Repository = "https://github.com/SimBe195/2022-09-01_neurio"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.uv]
package = false

[tool.uv.sources]
# Fork that tells for each screen pixel whether it shows the backdrop, the background or a sprite
nes-py = { path = "external/nes-py" }

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "test", "scripts"]
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # jaxtyping shape strings such as "batch channel" are no Python expressions; one-word shapes get a leading space
    "F722",
    # Base classes define optional hooks as empty methods
    "B027",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
filterwarnings = [
    # MLflow's tracking store still uses a loader strategy that SQLAlchemy 2.1 deprecates (as of MLflow 3.17)
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
]

[tool.ty.src]
# Tests are typed loosely on purpose
include = ["src", "scripts"]
