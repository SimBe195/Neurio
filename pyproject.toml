[project]
name = "neurio"
version = "0.1.0"
description = "Training a super-mario-bros AI using reinforcement learning"
authors = [{ name = "Simon Berger" }]
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "gym-super-mario-bros>=9.1.0",
    "gymnasium>=1.3.0",
    "hydra-core>=1.3.7",
    "hydra-optuna-sweeper>=1.3.0",
    "jaxtyping>=0.3.11",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "torch>=2.14.1",
    "torchinfo>=1.8.0",
    "tqdm>=4.70.1",
]

[project.urls]
Repository = "https://github.com/SimBe195/2022-09-01_neurio"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
