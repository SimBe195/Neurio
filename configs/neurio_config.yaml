defaults:
  - agent: dreamer
  - environment: base
  - levels: curriculum
  - _self_

_target_: config.main_config.NeurioConfig
num_workers: 32
num_iters: 5000
steps_per_iter: 128
# Iterations between checkpoints of the agent's networks
save_frequency: 100
# Iterations between saves of the full state of training to resume from, which take several GB with the agent's replay
resume_frequency: 1000
# Relative paths are resolved against the directory training is started from
tracking_uri: sqlite:///mlflow.db
# Curiosity driven exploration, see config.exploration.ExplorationConfig. A step of careful progress earns about 0.15
# (0.025 per pixel after the reward scale, at about 6 pixels), so a step to the left instead of the right costs about
# 0.3. A bonus of 1 for a new cell outweighs that until about 10 visits, while cells visited thousands of times pay
# about 0.01: going back into rarely visited cells beats going on through well known ones, e.g. to the one hole in 4-4's
# maze that leads into its bottom corridor, which is only reached by walking back to the left. 0.1 was too little for it.
exploration:
  _target_: config.exploration.ExplorationConfig
  bonus_scale: 1.0
  cell_size: 16
# mlflow tags of the run, add some with +tags.<name>=<value>
tags: {}
# Continue an interrupted run with the same config from its last checkpoint: true, false (start a new run) or null (ask)
resume: null
# Evaluation with test.py: run to load (default: the best of the experiment) and checkpoint (default: the latest)
test_run_id: null
test_iter: null
